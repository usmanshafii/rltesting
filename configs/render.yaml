# Scene generation: spec sections 4-6 and FYP_Sky_and_Background.md.
#
# Evidence tags (project rule: never let a convenient value pass as a KAL fact):
#   [spec]   fixed by the build spec or its sky companion
#   [calib]  measured on this renderer; see the note next to the value
#   [C]      plausible modelling assumption, used only because no reliable public data was found
# Nothing in this file is a KAL measurement except where the build spec says so.

dataset:
  n_scenes: 720                        # [spec] starter size 600-900
  splits: {train: 0.70, val: 0.15, test: 0.15}   # [spec] by scene; no scene in more than one split
  families: {open_sky: 0.5, horizon: 0.5}         # [spec] two background families
  lighting: {day: 0.45, dusk: 0.30, night: 0.25}  # [C] spec lists day, dusk, night without shares
  seed0: 0

# [spec 1] larger side of the projected box, in output pixels. The 64+ bin is open-ended in the
# spec; 256 px is only the sampling cap so the target still fits in a 640x512 frame [C].
size_bins:
  names: ["2-4", "4-8", "8-16", "16-32", "32-64", "64+"]
  edges_px: [[2, 4], [4, 8], [8, 16], [16, 32], [32, 64], [64, 256]]
  sampling: log_uniform                # [C] p_target drawn log-uniformly inside the bin

render:
  engine_samples: 256                  # [spec] Sky doc: 256 samples, adaptive threshold 0.01, no denoising
  adaptive_threshold: 0.01
  adaptive_min_samples: 16
  lwir_background_samples: 4           # [calib] emission-only, zero bounces: one ray per point is exact; 4 covers the 0.01 px jitter
                                       # (all thermal bands: tools/render_noise_check.py, horizon scene 14: render sigma
                                       # 0.01 x sensor in LWIR, 0.04 x in cooled LWIR)
  mwir_sun_background_samples: 32      # [calib] MWIR by day samples its sun lamp: 4 samples give 0.87 x the sensor sigma,
                                       # 32 give 0.18 x (target < 0.35, same check); night MWIR uses the 4 above
  filter_width_px: 0.01                # [spec] film filter; the PSF is applied explicitly
  light_paths: {total: 4, diffuse: 2, glossy: 2, transmission: 2, volume: 0, transparent: 8}   # [spec]
  background_bounces: 4                # total bounces for the target-free background renders; object crops always use light_paths
  clip_m: [0.1, 20000.0]               # [spec]
  mist_depth_m: 20000.0                # [spec] Mist pass start 0, depth 20 km; Blender stores ray distance [calib]
  supersample_background: 2            # [spec] 2x by default
  supersample_object: 2                # [spec]
  supersample_small_object: 4          # [spec] 4x for the 2-8 px bins
  small_object_px: 8
  crop_margin_px: 3                    # output px added around each object crop, on top of 3 sigma of the PSF
  exr_codec: ZIP
  persistent_data: true                # [spec]
  # Rotation of the propeller blades over each band's integration time, as a time-averaged coverage texture
  # (render/rotation_blur.py). Speed: target.yaml prop_rpm. [C: installed operating speed unknown]
  rotation_blur: {enabled: true, texture_px: 256}   # exact closed-form time average, no time sampling

camera:
  height_m: [1.5, 3.0]                 # [spec]
  # Open sky 5-60 deg, drawn log-uniformly (median ~17 deg for the narrow camera): long-range approaches sit low in
  # the sky against warm, near-horizon sky, while some high-elevation views remain. The old uniform 10-60 deg
  # over-weighted cold zenith sky, which flatters LWIR. The wide camera's frame still starts >= 13.4 deg up
  # (half its 24.8 deg VFOV + margin). Horizon family unchanged. [spec, revised 2026-10-01 on request]
  look_elevation_deg: {open_sky: [5.0, 60.0], horizon: [-1.0, 5.0]}
  look_elevation_sampling: {open_sky: log_uniform, horizon: uniform}
  open_sky_edge_margin_deg: 1.0        # [C] open-sky frames keep their lower edge above the horizon
  roll_deg: 0.0

sky:
  sun_elevation_deg: {day: [15.0, 60.0], dusk: [-6.0, 15.0], night: [-40.0, -18.0]}   # [spec] day 15-60, dusk down to -6; night [C]
  sun_near_los_prob: 0.15              # [spec] "including sun near the line of sight"; share [C]
  sun_near_los_cone_deg: 20.0          # [C]
  air: [1.0, 2.0]                      # [spec]
  dust: [0.5, 6.0]                     # [spec] legacy; with the climate on, dust follows the scene's visibility
                                       # (render/sampling.dust_for_visibility: Blender's Nishita aerosol constants)
  ozone: [1.0, 3.0]                    # [spec]
  sun_angle_deg: 0.526                 # [spec] true solar disc
  # [calib] Sun lamp. The Sky doc suggests 700-1000 W/m2, but Blender's Nishita sky is only ~10
  # (radiance) at 30 deg sun elevation, and its own sun disc delivers ~110-150 normal irradiance.
  # A 1000 W/m2 lamp would make sunlit paint ~7x too bright against the sky, which biases exactly
  # the target-vs-sky contrast this project measures. The lamp's irradiance and colour are
  # therefore measured per scene from the Nishita sun disc with the same air/dust/ozone.
  sun_calibration: nishita
  sun_calibration_samples: 256
  clouds: {prob: 0.3, coverage: [0.05, 0.45], scale: [1.5, 6.0], softness: [0.04, 0.15], brightness: [0.25, 0.7]}   # [C]
  night:                               # [C] moonlit / starlit sky from the same sky model
    moon_prob: 0.6
    moon_elevation_deg: [10.0, 70.0]
    moon_to_sun_ratio: [1.0e-6, 2.5e-6]   # full-moon illuminance ~0.1-0.25 lx vs ~1e5 lx sunlight
    airglow_rgb: [3.0e-6, 3.0e-5]      # starlight + airglow floor, radiance units of the Nishita sky

ground:                                # horizon family (also present, unseen, under open sky for bounce light)
  size_m: 20000.0                      # [spec]
  grid: 160                            # [C] vertices per side
  hill_amplitude_m: [0.0, 60.0]        # [spec] "low hills"; numbers [C]
  hill_wavelength_m: [1500.0, 5000.0]  # [C]
  edge_ridge_m: [15.0, 120.0]          # [C] distant ridge keeps the terrain silhouette above the geometric horizon
  flat_radius_m: 200.0                 # [C] flat pad around the camera
  texture_scale_m: [8.0, 60.0]         # [C] procedural albedo / temperature variation, drawn per band:
  texture_contrast: [0.10, 0.35]       # [C] the patterns do not line up across bands (spec 7.2 rule 4)

structures:                            # [spec] "horizon with terrain and structures"; numbers [C]
  buildings: [0, 10]
  building_w_m: [8.0, 45.0]
  building_d_m: [8.0, 45.0]
  building_h_m: [4.0, 30.0]
  building_distance_m: [150.0, 7000.0]
  masts: [0, 3]
  mast_h_m: [15.0, 70.0]
  mast_r_m: [0.3, 1.2]
  mast_distance_m: [300.0, 6000.0]
  view_margin_deg: 5.0

target:
  airspeed_mps: {default: 44.0, range: [39.0, 56.0]}   # spec 3.1 (160 km/h). [B] press report: cruise 160-200 km/h (44-56 m/s), operating altitude up to 5,000 m (Indian Masterminds, 21 Sep 2026, Pokhran trials)
  wind_mps: [0.0, 15.0]                # [spec]
  heading_deg: [0.0, 360.0]            # [C]
  pitch_deg: [-10.0, 10.0]             # [C]
  roll_deg: [-35.0, 35.0]              # [C]
  level_flight_prob: 0.4               # [C] pitch = roll = 0
  min_agl_m: 20.0                      # [C] horizon family: stay above terrain
  max_altitude_m: null                 # [C] optional cap; null keeps the spec's placement (any ray in the FOV)
  place_tries: 200

negatives:                             # hard negatives, labelled with their own class (spec 6, 7)
  count: [0, 3]                        # [spec]
  class_probs: {bird: 0.34, kite: 0.10, light_aircraft: 0.12, helicopter: 0.10, small_uav: 0.19, warm_clutter: 0.15}   # [C]
  bin_probs: [0.25, 0.25, 0.20, 0.15, 0.10, 0.05]      # [C] mostly the small sizes where confusion happens
  min_gap_px: 4                        # [C] no overlap with the target or each other
  classes:                             # sizes and speeds [C]; generic, not KAL data
    bird:           {span_m: [0.25, 2.2], speed_mps: [4.0, 20.0], min_agl_m: 3.0}
    kite:           {span_m: [0.6, 1.6], speed_mps: [0.0, 2.0], min_agl_m: 10.0, max_agl_m: 300.0}
    light_aircraft: {span_m: [9.0, 12.0], speed_mps: [45.0, 75.0], min_agl_m: 150.0}
    helicopter:     {span_m: [8.0, 14.0], speed_mps: [0.0, 60.0], min_agl_m: 60.0}
    small_uav:      {span_m: [0.25, 1.2], speed_mps: [0.0, 18.0], min_agl_m: 3.0}
    warm_clutter:   {span_m: [0.8, 5.0], speed_mps: [0.0, 0.0], families: [horizon]}   # on terrain or roofs

weather:                               # nominal haze per scene; applied in the loader from the Mist pass [spec]
  probs: {clear: 0.4, haze: 0.45, fog: 0.15}                   # [C]
  visibility_km: {clear: [20.0, 60.0], haze: [4.0, 20.0], fog: [0.6, 4.0]}   # [C]
  # extinction relative to the visible band (k = 3.912 / V for RGB). [spec] qualitative: LWIR passes
  # haze better than RGB, fog attenuates LWIR strongly, SWIR has a haze advantage. Ratios [C].
  band_ratio:
    haze:  {rgb: 1.0, swir: [0.35, 0.7], lwir: [0.08, 0.3]}
    clear: {rgb: 1.0, swir: [0.35, 0.7], lwir: [0.08, 0.3]}
    fog:   {rgb: 1.0, swir: [0.8, 1.0], lwir: [0.6, 1.0]}
  # Cooled LWIR and MWIR (CLAUDE.md sensor set rule) see the same aerosol as the uncooled LWIR camera: their ratios are
  # drawn at the LWIR ratio's quantile within their own ranges (render/sampling.py). [C] MWIR between SWIR and LWIR
  # (extinction falls with wavelength across 1-10 um for haze and smog aerosol); fog droplets are large in all bands.
  band_ratio_thermal:
    haze:  {lwir_cooled: [0.08, 0.3], mwir: [0.15, 0.45]}
    clear: {lwir_cooled: [0.08, 0.3], mwir: [0.15, 0.45]}
    fog:   {lwir_cooled: [0.6, 1.0], mwir: [0.7, 1.0]}
  aerosol_scale_height_m: 1500.0       # [C] slant paths: optical depth k*H/sin(el)*(1-exp(-d*sin(el)/H)); null = spec's homogeneous k*d
  # LWIR absorption by water vapour along the path, from the scene's humidity draw (thermal/atmosphere.py). Applied in
  # the loader on top of the aerosol term (no re-render); pre-v2 scenes without humidity are unaffected. Clear air
  # included: in a monsoon afternoon it alone leaves ~30 % of the target's contrast at 2.4 km.
  lwir_water_vapour:
    enabled: true
    continuum_scale_height_m: 1000.0   # [C+] self-continuum ~ vapour density^2: half of a ~2 km vapour scale height
    edge_co2: 0.03                     # [C+] band-edge line absorption, saturating within ~100 m (CO2, 13-14 um)
    edge_h2o_at_45hpa: 0.08            # [C+] water lines near 8 um; with the continuum: 80 % over 100 m at 35 C / 80 % RH (FLIR 2016)
    edge_saturation_m: 50.0            # [C]
  resample_in_training: 0.5            # [C] probability the training loader redraws visibility (climate scenes:
                                       # a 0.7-1.4 jitter around the scene's own, because their sky carries its haze)

air_temp_c: {default: [-20.0, 50.0], desert_day: [35.0, 50.0], desert_day_prob: 0.25}   # [spec] legacy: climate off

# Lahore (CLAUDE.md sensor set rule 6, user 2026-10-12: "Lahore's climate from the past 3 years"): every scene takes a
# real hour of the NOAA ISD record of LAHORE CITY (416400) in its own lighting state (day: sun >= 15 deg, dusk -6 to 15,
# night <= -18, as sky.sun_elevation_deg), with that hour's air temperature, humidity, weather (WMO present-weather
# codes), visibility, total cloud cover and station pressure. NOAA's archive for Lahore ends on 2025-08-24, so the
# window is the last three years on record (tools/source_measurements.lahore_climate; docs/lahore_climate.md).
climate:
  enabled: true
  source: "NOAA ISD 41640099999 LAHORE CITY, 2022-08-25 to 2025-08-24"
  file: docs/sources/noaa_isd/lahore_hourly_conditions_2022-08-25_2025-08-24.csv
  visibility_report_ceiling_km: 5.0      # [B] the station reports above 5 km in 1.4 % of hours (max 8 km in 3 years)
  visibility_beyond_ceiling_km: 15.0     # [C] an unobscured hour at the ceiling: drawn up to here (log-uniform)
  visibility_min_km: 0.05                # [B] the record's 50 m floor (fog)

# Clear air for the thermal cameras (thermal/atmosphere_bands.py; docs/thermal_bands.md): a layered atmosphere above the
# camera from the scene's air temperature and vapour pressure, SP-3080 / HITRAN narrow bands, MT_CKD 4.3 continuum and
# the N2 band, grey aerosol from the scene's visibility. Drawn per scene on its own random stream; the radiative
# transfer runs once per scene at render time (scene_tables) and is stored in the metadata (extra.thermal).
thermal_atmosphere:
  enabled: true
  surface_pressure_hpa: 988.0          # [C+] ISA at Lahore City's 214 m (IGRA 2 station list); climate update to source
  lapse_k_per_km: [4.5, 7.7]           # [B] surface-500 hPa, 10-90 % of 2,756 soundings, Lahore / Patiala / New Delhi
                                       #     Oct 2023 - Sep 2026 (NOAA IGRA 2; docs/sources/noaa_igra2)
  # vapour scale height: ln H_w = 6.003 + 0.487 ln e_sfc +- 0.37 (same soundings; thermal/atmosphere_bands.VAPOUR_FIT)
  co2_ppm: [419.0, 440.0]              # [B] NOAA GML global mean 2023-2026 419-428; top: urban boundary layer [C]
  n2o_ppb: [336.0, 340.0]              # [B] NOAA GML global mean 2023-2025 336.7-338.9
  ch4_ppb: [1920.0, 2100.0]            # [B] NOAA GML global mean 2023-2025 1921-1936; top: South Asian plains [C]
  co_ppb_surface: [150.0, 3000.0]      # [C] polluted urban boundary layer (log-uniform); free troposphere below
  co_ppb_free: 100.0                   # [C]
  boundary_layer_m: 1500.0             # [C] = aerosol_scale_height_m
  continuum_scale: [1.0, 1.44]         # [B] water-vapour continuum: MT_CKD 4.3 (1.0) to Roberts et al. 1976 (1.44 at
                                       #     1000 cm-1): two sources, the range covers both (CLAUDE.md evidence rule 5)
  # The clear-air 8-14 um flux emittance comes out 0.04-0.15 below Idso (1981) (no ozone, no aerosol in the model);
  # a grey window absorber (714-1300 cm-1) closes a uniformly drawn share of the gap (scene_tables).
  window_absorber_scale_height_m: 1500.0   # [C]
  aerosol:                             # grey per band; extinction = 3.912 / V x weather.band_ratio
    scale_height_m: 1500.0             # [C] = weather.aerosol_scale_height_m
    asymmetry_g: [0.6, 0.8]            # [C] Henyey-Greenstein g of haze / smog aerosol at 4 um
    omega0: {lwir: [0.3, 0.7], lwir_cooled: [0.3, 0.7], mwir: [0.6, 0.95]}   # [C] single-scattering albedo
