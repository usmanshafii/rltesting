# KAL target geometry: the single source of truth for build_target(), the variant
# sampler, the reference drawing and the photo acceptance check.
#
# Units: airframe lengths are fractions of the WINGSPAN unless the key says otherwise
#   *_over_root      fraction of the root chord
#   *_over_forebody  fraction of the forebody diameter
#   *_deg            degrees
#   *_m              metres, fixed (engine and propeller hardware does not scale with the airframe)
# span_m converts span units to metres.
#
# Entries with `range` are sampled uniformly by the variant sampler. The range is
# the measurement uncertainty from the photos, kept wide where the photos disagree,
# so the detector trains across the plausible real shape instead of one guess.
#
# Evidence keys (docs/reference/photos/), grades A-D as in the configs/signatures.yaml header:
#   P1 the user's overhead image. It is AI-generated (user, 2026-10-08): used for APPEARANCE ONLY
#      (shapes, colours, markings), never to measure a span, width, length or diameter
#   P2 3/4 view on the launch vehicle at sunset (length, fins, probe, antennas, body side profile)
#   P3 exhibition close-up of the upper surface (finish, markings, round body standing proud of the wing)
#   P4 underside close-up on the launcher (finned cylinders each side, drive-flange area, spinner, lower fins)
#   P5 elevated view on the launch vehicle, low resolution (absolute length)
#   P6, P7 flight silhouettes from below (planform ratios, forebody/span)
#   P8 near-axial rear view on the launcher (fin heights and split vs span, engine
#      width, elevon break, lettering orientation); fins and span at one depth
#   G1 Shahed-136 with its MD-550 at the 2023 IRGC exhibition, Kermanshah (Wikimedia Commons): the
#      closest drone analogue (user rule 2026-10-08: unverifiable KAL details come from it)

span_m: {default: 2.30, range: [2.00, 2.60], source: "not published; P5 length 3.1-3.5 m and P2 forebody 0.30-0.34 m against a Toyota Hilux"}

planform:
  root_chord:     {default: 1.00, range: [0.90, 1.12], source: "not observable in any single photo; P5 length / P6 forebody ratio"}
  tip_over_root:  {default: 0.17, range: [0.13, 0.21], source: "P6 0.19, P7 0.11 (banked, low weight); P1 0.20 agrees visually"}
  nose_over_root: {default: 0.27, range: [0.23, 0.30], source: "nose tip ahead of the wing apex: P6 0.29, P7 0.24; P1 0.26 agrees visually"}
  le_sweep_limits_deg: [54.0, 63.0]     # derived sweep must fall inside; otherwise the variant is resampled
  wing_tc:        {default: 0.06, range: [0.04, 0.09], source: "not visible; thin enough that the fuselage stands proud on both sides (P3, P4)"}
  wing_z:         {default: 0.00, range: [-0.015, 0.015], source: "mid-wing: fuselage protrudes above (P3) and below (P4)"}

control_surfaces:
  elevon_chord_over_root: {default: 0.09, range: [0.07, 0.11], source: "P1 hinge lines (appearance); no real photo shows them, C"}
  elevon_breaks:  [0.085, 0.285, 0.50]  # y stations: inner panel 0.085-0.285, outer 0.285-tip (P8 break at 0.29)

fuselage:
  forebody_dia:            {default: 0.140, range: [0.125, 0.155], source: "P6 13/89 px, P7 15/100 px"}
  dome_len_over_forebody:  {default: 0.90, range: [0.70, 1.10], source: "blunt ellipsoidal nose, P2 P6"}
  # Body behind the white band. P2's side silhouette (real) shows no visible step there and a body that
  # tapers only gently aft; P3 (real) shows a round tube standing well proud of the wing. The earlier
  # 0.72 step read as a bottle neck (user, 2026-10-08). P1 agrees visually with a mild step.
  tube_over_forebody:      {default: 0.86, range: [0.80, 0.92], source: "P2 silhouette, P3; P1 appearance"}
  pod_over_forebody:       {default: 0.93, range: [0.86, 1.00], source: "P1 appearance (slight swelling); P2 shows none, so the range includes the tube"}
  # The neck must hold the L550E mounting face (rear cover 144 mm, case 115 x 125 mm): >= 0.47 at span 2.3 m
  neck_over_forebody:      {default: 0.52, range: [0.47, 0.60], source: "engine mounting face (engine_l550e.MOUNT) and P1 appearance"}
  pod_start_over_root:     {default: 0.60, range: [0.56, 0.64], source: "P1 appearance (stations along the body)"}
  pod_max_over_root:       {default: 0.73, range: [0.69, 0.77], source: "P1 appearance"}
  neck_over_root:          {default: 0.92, range: [0.89, 0.95], source: "P1 appearance; P2 taper toward the tail"}
  collar_step_len:  0.050   # smooth forebody-to-tube taper starting where the leading edge meets the forebody
  band_width:       0.020   # white band, ends 0.01 ahead of the collar (P1 appearance, P3)

tip_fins:           # plates centred on the wing tips; TE a straight line through the wing TE (P2, P4)
  fin_up_height:    {default: 0.150, range: [0.12, 0.17], source: "P8 0.15-0.16 (span and fins at one depth); P2 with nose-nearer perspective"}
  fin_down_height:  {default: 0.150, range: [0.12, 0.18], source: "P8 0.14-0.16, split about even; P2 suggests slightly more below"}
  # The fin root covers the whole wing-tip chord (fin LE meets the tip LE), as on the Shahed-136 (G1) and in
  # P1's appearance; the old shorter root left a slanted strip of wing tip ahead of the fin (user, 2026-10-08).
  fin_root_over_tip_chord: {default: 1.00, range: [0.85, 1.00], source: "G1 analogue (B for Shahed, C for KAL), P1 appearance"}
  fin_tip_chord:    {default: 0.035, range: [0.02, 0.05], source: "P2 narrow top and bottom edges"}
  fin_te_rake_deg:  {default: 0.0, range: [-8.0, 8.0], source: "P2: TE within a few degrees of perpendicular; + tilts the top forward"}
  fin_thickness:    0.010

engine:             # Geran-2 engine (user decision 2026-10-08): MD-550 = Limbach L550E copy; see target/engine_l550e.py
  engine_model: "Mado MD-550 (Limbach L550E copy), as installed on Geran-2 / Shahed-136"
  engine_evidence: "KAL engine unpublished (D); analogue chosen by the user; envelope B (Limbach data); layout B (photos); internal sizes C"
  # Mounting face at the end of the fuselage, cylinders clear of the wing trailing edge (G1: engine aft
  # of the TE). check() rejects a variant whose nearest fin pack would cut the trailing edge.
  engine_start_over_root: {default: 1.00, range: [0.99, 1.04], source: "G1 installation; P4 engine at the trailing edge"}
  prop_hub_aft_flange_m:  0.035   # propeller hub centre behind the drive-flange face (C)

propeller:
  # Two-blade pusher on the drive flange (direct drive, P4, G1). Diameter: P6 shows >= 0.22 span below the
  # trailing edge (0.51 m at 2.3 m); the upper end is a visual allowance (C). Fixed in metres: the engine,
  # not the airframe, sets it.
  prop_dia_m:       {default: 0.58, range: [0.50, 0.64], source: "P6 lower bound; upper end C"}
  # Shaft speed, used ONLY for the rotation blur of the blades over each band's integration time
  # (render/rotation_blur.py). Assumed wide range for a direct-drive pusher, C; not a performance figure.
  prop_rpm:         [4000.0, 7500.0]
  blade_root_chord_m: 0.075
  blade_tip_chord_m:  0.045
  blade_pitch_deg:  20.0
  spinner_len_m:    0.070   # bullet-shaped hub at the centre of the prop blur (P4 grey cone)
  spinner_dia_m:    0.070
  prop_mode:        disc    # disc | blades | both ; RGB uses a translucent disc for motion blur

nose_details:       # visible in P2 on the flying article
  probe_len:        0.040
  probe_dia:        0.006
  antenna_x_from_nose: [0.060, 0.090]   # two blades on the upper dome/forebody
  antenna_height:   0.030
  antenna_chord:    0.020
  antenna_rake_deg: 30.0
  nose_window:      false   # not seen on this article; keep off

markings:           # decal quads with UVs 0..1; textures from tools/make_decals.py
  # "KAL" on both upper wing panels, baseline parallel to that wing's leading edge, letter tops toward the
  # leading edge, both reading left to right from behind (P8, P3; P1 appearance). Crossbar-less A (P3).
  wing_text_center_over_root: 0.55
  wing_text_y:      0.24
  wing_text_size:   [0.14, 0.045]       # length along the baseline, letter height
  fin_text:         true                # wordmark on both fin outer faces (P1 appearance)
  flag_x_over_root: -0.06               # small flag decal on the upper forebody (P1 appearance)
  flag_size:        [0.050, 0.034]

mesh:
  fuselage_segments: 24
  airfoil_points:    10     # per surface, cosine spaced, hinge line inserted
  prop_disc_segments: 32
  engine_segments:   16     # facets per engine cylinder (dataset mesh)

variants:
  seed: 20260924    # variant i uses its own stream seeded by (seed, i)
